<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>City Rut | Rotina Urbana</title>
  <meta name="description" content="City Rut - Um Life Sim e RPG Social 2D de sobrevivência e rotina urbana na metrópole." />
  
  <!-- Fontes Google para estética urbana moderna e retrô -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0e14;
      --panel-bg: rgba(18, 24, 38, 0.85);
      --accent-cyan: #00f2fe;
      --accent-pink: #ff007f;
      --accent-yellow: #f9d423;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%),
        linear-gradient(rgba(11, 14, 20, 0.95), rgba(11, 14, 20, 0.95));
      color: var(--text-main);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.15);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #000;
    }

    #game-container {
      width: 960px;
      height: 540px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d1117;
      overflow: hidden;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #ui-instructions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 960px;
      padding: 10px 18px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-muted);
    }

    .key-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1f293d;
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Press Start 2P', monospace;
      margin: 0 3px;
    }

    .status-hint {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .game-logo {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    @media (max-width: 1000px) {
      #game-wrapper {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: none;
      }
      #game-container {
        width: 100vw;
        height: calc(100vh - 45px);
      }
      #ui-instructions {
        width: 100vw;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>
    <div id="ui-instructions">
      <div class="game-logo">CITY RUT ⚡</div>
      <div class="status-hint">
        <span><span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> ou <span class="key-badge">Setas</span> Mover</span>
        <span><span class="key-badge">E</span> / <span class="key-badge">Espaço</span> Interagir</span>
        <span><span class="key-badge">M</span> Metrô/Mapa</span>
      </div>
      <div>v0.1.0 • WebGL/Canvas</div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
